<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 710" role="img" aria-labelledby="title desc">
<title id="title">Nexora Digital pink creator workspace</title>
<desc id="desc">Stylized creator working on a laptop in a soft pink studio with neon creator text.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#2d1722"/><stop offset=".55" stop-color="#6d3348"/><stop offset="1" stop-color="#2a141e"/></linearGradient>
