name: Deploy NexoraTikTok to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required site files
        shell: bash
        run: |
          set -e
          for f in index.html free-lessons.html courses.html support-program.html curriculum.html services.html prompt-book.html results.html faq.html learn.html enroll.html contact.html legal.html certificate.html verify-certificate.html offline.html admin.html admin-courses.html admin-analytics.html admin-operations.html admin-certificates.html admin-prompt-intake.html 404.html styles.css extras.css home-v2.css portal-cloud.css portal-v2.css course-library.css prompt-library.css student-notifications.css student-dashboard.css certificate.css certificate-verify.css admin.css admin-v2.css admin-courses.css admin-analytics.css admin-operations.css admin-certificates.css admin-prompt-intake.css app.js forms.js portal-extra.js portal-cloud.js portal-courses.js course-library.js prompt-library.js student-notifications.js student-dashboard.js certificate.js certificate-verify.js admin.js admin-courses.js admin-analytics.js admin-operations.js admin-certificates.js admin-prompt-intake.js sw.js site.webmanifest robots.txt sitemap.xml assets/logo.svg VERSION; do
            test -f "$f" || { echo "Missing required file: $f"; exit 1; }
          done
          echo "Required files OK"

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -e
          for f in app.js forms.js portal-extra.js portal-cloud.js portal-courses.js course-library.js prompt-library.js student-notifications.js student-dashboard.js certificate.js certificate-verify.js admin.js admin-courses.js admin-analytics.js admin-operations.js admin-certificates.js admin-prompt-intake.js sw.js; do
            node --check "$f"
          done
          echo "JavaScript syntax OK"

      - name: Privacy and secret guard
        shell: bash
        run: |
          set -e
          if grep -Fq "Student note preview" admin.js; then
            echo "Admin privacy regression: private student notebook preview found"
            exit 1
          fi
          if grep -Fq "nexora_portal_state').select('*')" admin.js; then
            echo "Admin privacy regression: wildcard student-state select found"
            exit 1
          fi
          if grep -Fq '<script src="app.js"></script>' admin.html; then
            echo "Admin isolation regression: public app.js loaded on admin page"
            exit 1
          fi
          if grep -RInE 'SUPABASE_SERVICE_ROLE_KEY|service_role|client_secret' --include='*.js' --include='*.html' .; then
            echo "Potential server secret reference found in browser assets"
            exit 1
          fi
          echo "Privacy and secret guards OK"

      - name: Prompt intake safety guard
        shell: bash
        run: |
          set -e
          grep -Fq "admin_users" admin-prompt-intake.js || { echo "Prompt intake must verify admin access"; exit 1; }
          grep -Fq "nexora_prompts" admin-prompt-intake.js || { echo "Prompt intake database target missing"; exit 1; }
          grep -Fq 'noindex,nofollow,noarchive' admin-prompt-intake.html || { echo "Prompt intake must remain noindex"; exit 1; }
          echo "Prompt intake guards OK"

      - name: PWA cache safety guard
        shell: bash
        run: |
          set -e
          grep -Fq "'/admin'" sw.js || { echo "Service worker must exclude admin routes"; exit 1; }
          grep -Fq "'/learn.html'" sw.js || { echo "Service worker must exclude Student Portal route"; exit 1; }
          grep -Fq "'/certificate.html'" sw.js || { echo "Service worker must exclude private certificate route"; exit 1; }
          grep -Fq "'/enroll.html'" sw.js || { echo "Service worker must exclude enrollment route"; exit 1; }
          if grep -Fq "./admin.html" sw.js || grep -Fq "./learn.html" sw.js; then
            echo "Private page found in service worker precache"
            exit 1
          fi
          echo "PWA cache safety guards OK"

      - name: Check local HTML links
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, sys
          broken=[]
          for page in Path('.').glob('*.html'):
              text=page.read_text(encoding='utf-8')
              for href in re.findall(r'href=["\']([^"\']+)["\']', text):
                  if href.startswith(('#','http://','https://','mailto:','tel:','javascript:')):
                      continue
                  target=href.split('#',1)[0].split('?',1)[0]
                  if target and not Path(target).exists():
                      broken.append((page.name,href))
          if broken:
              for page,href in broken:
                  print(f'Broken local link: {page} -> {href}')
              sys.exit(1)
          print('Local links OK')
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4