name: Deploy Nexora to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

  android-demo:
    if: github.event_name == 'pull_request' && github.head_ref == 'mobile-app-v1'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Nexora Android v1.2 source
        uses: actions/checkout@v4
        with:
          ref: mobile-app-v1-2
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Accept Android licenses and install SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build Nexora Android v1.2
        run: gradle -p android-v1-1 assembleDebug --stacktrace
      - name: Rename APK
        run: cp android-v1-1/app/build/outputs/apk/debug/app-debug.apk Nexora_Android_v1.2.apk
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Nexora-Android-v1.2
          path: Nexora_Android_v1.2.apk
          if-no-files-found: error

  android-v1-2:
    if: github.event_name == 'pull_request' && github.head_ref == 'mobile-app-v1-2'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Android v1.2 branch
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Accept Android licenses and install SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build Nexora Android v1.2
        run: gradle -p android-v1-1 assembleDebug --stacktrace
      - name: Rename APK
        run: cp android-v1-1/app/build/outputs/apk/debug/app-debug.apk Nexora_Android_v1.2.apk
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Nexora-Android-v1.2
          path: Nexora_Android_v1.2.apk
          if-no-files-found: error
