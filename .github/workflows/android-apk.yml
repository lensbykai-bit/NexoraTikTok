name: Build Android APK

on:
  push:
    branches: [ mobile-app-v1 ]
    paths:
      - 'mobile-app-project.zip'
      - 'MOBILE_APP_README.md'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: mobile-app-v1

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: |
          rm -rf mobile-app
          mkdir -p mobile-app
          unzip -q mobile-app-project.zip -d mobile-app

      - name: Build debug APK
        run: gradle -p mobile-app assembleDebug --stacktrace

      - name: Copy APK
        run: cp mobile-app/app/build/outputs/apk/debug/app-debug.apk Nexora_Android_v1.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nexora-Android-v1
          path: Nexora_Android_v1.apk
          if-no-files-found: error

      - name: Save APK to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Nexora_Android_v1.apk
          git diff --cached --quiet && exit 0
          git commit -m "Build Android APK v1 [skip ci]"
          git push origin HEAD:mobile-app-v1
