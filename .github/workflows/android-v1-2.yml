name: Build Nexora Android v1.2

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-v1-2:
    if: github.event_name == 'pull_request' && github.head_ref == 'mobile-app-v1-2'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle -p android-v1-1 assembleDebug --stacktrace
      - name: Rename APK
        run: cp android-v1-1/app/build/outputs/apk/debug/app-debug.apk Nexora_Android_v1.2.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Nexora-Android-v1.2
          path: Nexora_Android_v1.2.apk
          if-no-files-found: error
