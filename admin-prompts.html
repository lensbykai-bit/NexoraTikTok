<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#11070d"><title>Nexora Digital — Prompt Manager</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="admin.css"><link rel="stylesheet" href="admin-courses.css"></head><body class="admin-body">
<header class="admin-header"><div class="shell admin-nav"><a class="brand" href="index.html"><span class="brand-mark">N</span><span><b>NEXORA</b><small>ADMIN</small></span></a><nav><a href="admin.html">Analytics</a><a href="admin-courses.html">Course Manager</a><a class="active" href="admin-prompts.html">Prompt Manager</a><a href="prompt-book.html">Public Library</a></nav><button class="btn btn-ghost" id="promptAdminLogout" type="button">Log Out</button></div></header>
<main class="shell manager-main"><section id="promptAdminGate" class="admin-gate"><span>ADMIN ACCESS</span><h1>Checking permission…</h1></section><div id="promptAdminApp" hidden><section class="admin-hero"><div><span>PROMPT MANAGER</span><h1>Prompt <em>Library.</em></h1><p>Create and organize original Nexora creator prompts.</p></div><button class="btn btn-primary" id="newPromptBtn">+ New Prompt</button></section>
<div class="manager-grid"><section class="admin-panel"><div class="admin-section-title"><div><span>LIBRARY</span><h2>Prompts</h2></div></div><div id="adminPromptList" class="manager-list"></div></section><section class="admin-panel editor-panel"><div class="admin-section-title"><div><span>EDITOR</span><h2 id="promptEditorTitle">Create prompt</h2></div></div><form id="promptAdminForm" class="manager-form"><input id="promptId" type="hidden"><label>Title<input id="promptTitle" required></label><label>Category<input id="promptAdminCategory" required placeholder="TikTok"></label><label>Description<textarea id="promptDescription" rows="3"></textarea></label><label>Prompt text<textarea id="promptText" rows="10" required></textarea></label><div class="form-row"><label>Sort order<input id="promptSort" type="number" value="0"></label><label class="check-label"><input id="promptPublished" type="checkbox" checked> Published</label></div><div class="form-actions"><button class="btn btn-primary" type="submit">Save Prompt</button><button class="btn btn-ghost" id="deletePromptBtn" type="button" hidden>Delete</button></div><p id="promptAdminMessage" class="manager-message"></p></form></section></div></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="auth.js"></script><script src="admin-prompts.js"></script></body></html>
